<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedSwiff — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F14; --surface-1:#111827; --surface-2:#151B24;
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14);
    --text-1:#F3F5F8; --text-2:#94A3B8; --text-3:#5B6B80;
    --teal:#31D2C1; --teal-dim:rgba(49,210,193,0.14);
    --purple:#8C7CF0; --purple-dim:rgba(140,124,240,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text-1);
    font-family:'Inter', -apple-system, sans-serif; padding:40px 24px;
  }
  .wrap{max-width:1100px; margin:0 auto;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:32px; flex-wrap:wrap; gap:16px;}
  h1{font-size:22px; margin:0; font-weight:700;}
  .sub{color:var(--text-2); font-size:14px; margin-top:4px;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:9px;
    background:linear-gradient(135deg,var(--teal),#22b8a8); color:#04201C; font-weight:600;
    font-size:14px; border:none; cursor:pointer; text-decoration:none;
  }
  .btn:hover{opacity:0.92;}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:32px;}
  @media (max-width:700px){ .stats{grid-template-columns:1fr 1fr;} }
  .stat{background:var(--surface-1); border:1px solid var(--border); border-radius:12px; padding:18px;}
  .stat .num{font-size:26px; font-weight:700;}
  .stat .lbl{font-size:12.5px; color:var(--text-3); margin-top:4px;}
  .panel{background:var(--surface-1); border:1px solid var(--border); border-radius:14px; padding:22px; margin-bottom:24px;}
  .panel h2{font-size:15px; margin:0 0 16px;}
  .breakdown-row{display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--border); font-size:14px;}
  .breakdown-row:first-child{border-top:none;}
  .breakdown-row span:first-child{color:var(--text-2);}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th, td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap;}
  th{color:var(--text-3); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.03em;}
  td{color:var(--text-1);}
  .table-wrap{overflow-x:auto;}
  .empty, .loading, .error-msg{color:var(--text-2); font-size:14px; padding:20px 0; text-align:center;}
  .error-msg{color:#E4685D;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>MedSwiff — Leads</h1>
      <div class="sub">Demo request submissions from the live site.</div>
    </div>
    <a class="btn" href="/api/leads?format=csv" id="exportBtn">Export CSV ↓</a>
  </header>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <h2>By practice type</h2>
    <div id="byType"></div>
  </div>

  <div class="panel">
    <h2>By reported bottleneck</h2>
    <div id="byBottleneck"></div>
  </div>

  <div class="panel">
    <h2>All submissions</h2>
    <div id="tableWrap" class="table-wrap">
      <div class="loading">Loading…</div>
    </div>
  </div>
</div>

<script>
  async function load() {
    const tableWrap = document.getElementById('tableWrap');
    try {
      const res = await fetch('/api/leads');
      if (!res.ok) throw new Error('Failed to load');
      const leads = await res.json();
      renderStats(leads);
      renderBreakdown('byType', leads, 'practice_type');
      renderBreakdown('byBottleneck', leads, 'bottleneck');
      renderTable(leads);
    } catch (err) {
      tableWrap.innerHTML = '<div class="error-msg">Could not load leads. If this page isn\'t behind Cloudflare Access yet, /api/leads may not be reachable.</div>';
    }
  }

  function renderStats(leads) {
    const total = leads.length;
    const now = Date.now();
    const last7d = leads.filter(l => now - new Date(l.created_at).getTime() < 7 * 24 * 60 * 60 * 1000).length;
    const last30d = leads.filter(l => now - new Date(l.created_at).getTime() < 30 * 24 * 60 * 60 * 1000).length;
    const uniqueClinics = new Set(leads.map(l => l.clinic)).size;

    document.getElementById('stats').innerHTML = [
      ['Total leads', total],
      ['Last 7 days', last7d],
      ['Last 30 days', last30d],
      ['Unique clinics', uniqueClinics],
    ].map(([lbl, num]) => `<div class="stat"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`).join('');
  }

  function renderBreakdown(elId, leads, field) {
    const counts = {};
    leads.forEach(l => {
      const key = l[field] || '—';
      counts[key] = (counts[key] || 0) + 1;
    });
    const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const el = document.getElementById(elId);
    if (entries.length === 0) {
      el.innerHTML = '<div class="empty">No data yet.</div>';
      return;
    }
    el.innerHTML = entries.map(([k, v]) => `<div class="breakdown-row"><span>${escapeHtml(k)}</span><span>${v}</span></div>`).join('');
  }

  function renderTable(leads) {
    const tableWrap = document.getElementById('tableWrap');
    if (leads.length === 0) {
      tableWrap.innerHTML = '<div class="empty">No submissions yet.</div>';
      return;
    }
    const rows = leads.map(l => `
      <tr>
        <td>${formatDate(l.created_at)}</td>
        <td>${escapeHtml(l.name)}</td>
        <td>${escapeHtml(l.email)}</td>
        <td>${escapeHtml(l.clinic)}</td>
        <td>${escapeHtml(l.practice_type)}</td>
        <td>${escapeHtml(l.current_system || '—')}</td>
        <td>${escapeHtml(l.bottleneck)}</td>
      </tr>
    `).join('');
    tableWrap.innerHTML = `
      <table>
        <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Clinic</th><th>Type</th><th>System</th><th>Bottleneck</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' +
           d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  load();
</script>
</body>
</html>
